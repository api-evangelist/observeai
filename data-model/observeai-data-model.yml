docs: https://api-docs.observe.ai/bulk-export/
summary: >-
  The Observe.AI domain is anchored on the Interaction — one customer
  conversation on voice, webchat or an external channel. Everything else hangs
  off it: transcripts and Moments, AI-generated summaries, sentiment metrics and
  contact reasons enrich the interaction; evaluations (Auto QA and manual) score
  it against an evaluation template; ack/dispute records track the agent's
  response to a score; coachings close the loop with the agent. Users, teams and
  accounts form the org graph, and assignment entities (agent performance, audit,
  calibration) are the work-queue layer that routes interactions to evaluators.
  Nearly every entity carries a paired partner_* identifier, which is the
  customer's own id for the same person or conversation — the join key back into
  the customer's CRM/CCaaS.
id_conventions:
  primary_key: id or _id
  external_mirror: partner_<entity>_id
  external_mirror_note: >-
    partner_agent_id, partner_evaluator_id, partner_coach_id and
    source_partner_meeting_id hold the identifier from the client's own system,
    letting Observe.AI records be joined to CRM/CCaaS/WFM records without a
    lookup table. Field descriptions for these were added across 2023.
  legacy_alias:
    meeting_id: >-
      Evaluation entities still key interactions as meeting_id (and the legacy
      Calls Report API used observeCallId); the Interactions surface renamed the
      same concept to id / interaction_id. All three refer to one interaction.
