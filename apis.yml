- aid: observeai:observeai-interactions-api
  name: Observe.AI Interactions API
  description: >-
    Interactions API is an omnichannel API can be used to obtain all the data related to the interactions
    like Moments, Transcripts and metadata related to Interactions(including Voice calls and Web chat).


    Please note -

    <ol>
      <li>Allow 24 hrs to pass before pulling Interactions. ie., For Interactions completed on 14-Jan
    by 12:00AM PST, they would be available via APIs by 15-Jan by 12:00AM PST.</li>
      <li>You can pull Interactions for 30 days at a time i.e., the duration between the end_date and
    the start_date should not exceed 30 days.</li>
      <li>There is no limit as to how far back in the past you want to go for pulling Interactions. You
    can go back to the first ever evaluation on the platform unless data retention limits have been set.</li>
      <li>Interactions API gives a paginated response so the customer need to specify the page number
    and the desired amount of interactions in a page. By default, page_size is set to 100</li>
      <li>There is flexibility to either include or exclude Transcript in the API response by setting
    a query parameter includeTranscript. By default it is set to false.</li>
      <li>The S3 URL obtained in the API response (with the interactions) is valid for 24 hours.</li>
      <li>Clients using ‘Calls report API’ are requested to switch to ‘Interactions API’ which provides
    several benefits listed <a href="#tag/CallsReportVsInteractions">here</a>. ‘Calls report API’ will
    be deprecated after 31-Dec-2022. Please reach out to your CSM for more details.</li>
      <li>If you have been using Basic Auth for the APIs, we request you to switch to OAuth2.0 based Auth
    for the APIs by 31-Dec-2022. Detailed instructions to create API Credentials and make the switch to
    OAuth are documented <a href="#tag/Authentication">here</a>. Please reach out to your CSM for more
    details.</li>
      <li>If you need to pull Interactions by ID, there is a separate synchronous API - <a href="#tag/Interactions/operation/Get
    Interactions By Ids">Get Interactions By Ids</a>.</li>
    </ol>
