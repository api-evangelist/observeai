- aid: observeai:observeai-ack-dispute-flow-api
  name: Observe.AI Ack Dispute Flow API
  description: >-
    Ack Dispute API can be used to pull all evaluation related data which are sent for acknowledgment
    or dispute.


    Please note -
        <ol>
          <li>Allow 24 hrs to pass before pulling Ack Dispute Data. ie., For Evaluations completed on
    14-Jan by 12:00AM PST, they would be available via APIs by 15-Jan by 12:00AM PST.</li>
          <li>You can pull Ack Dispute for 90 days at a time i.e., the duration between the end_date and
    the start_date should not exceed 90 days.</li>
          <Li>There is no limit as to how far back in the past you want to go for pulling Ack Dispuet
    Data. You can go back to the first ever evaluation on the platform unless data retention limits have
    been set.</li>
          <li>The S3 URL obtained in the API response (with the evaluations) is valid for 24 hours.
                                    </li>
          <li>If you have been using Basic Auth for the APIs, we request you to switch to OAuth2.0 based
    Auth for the APIs by 31-Dec-2022. Detailed instructions to create API Credentials and make the switch
    to OAuth are documented <a href="#tag/Authentication">here</a>. Please reach out to your CSM for more
    details.</li>
        </ol>
