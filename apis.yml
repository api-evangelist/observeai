apis:
- name: Observe.AI Reporting APIs
  description: >-
    Asynchronous REST APIs that export Observe.AI contact-center data into
    external systems: Interactions (Moments, transcripts and metadata for voice
    calls, webchat and email), Summarization AI (GenAI summaries), Evaluations
    (Auto QA and manual evaluation forms with question-level and aggregate
    scores), Coachings (coaching sessions with mapped evaluations and notes),
    Ack/Dispute state changes, and DSR (Data Subject Request) deletion. Every
    reporting call is a two-step async flow — POST registers a request and
    returns a request_id, then GET polls that id until COMPLETED and returns a
    pre-signed S3 URL valid for 24 hours. Auth is OAuth 2.0 client-credentials
    (App ID + App Secret exchanged for a 2-hour bearer JWT).
  humanURL: https://api-docs.observe.ai/
  baseURL: https://kong.observe.ai/
