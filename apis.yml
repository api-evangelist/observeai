- aid: observeai:observeai-coachings-api
  name: Observe.AI Coachings API
  description: >-
    Coachings API can be used to pull all the Coaching sessions done on Observe AI platform.

    Please note -
      <ol>
        <li>Allow 24 hrs to pass before pulling Coaching sessions. ie., For Coaching sessions completed
    on 14-Jan by 12:00AM PST, they would be available via APIs by 15-Jan by 12:00AM PST.</li>
        <li>You can pull Coaching sessions for 90 days at a time i.e., the duration between the end_date
    and the start_date should not exceed 90 days.</li>
        <Li>There is no limit as to how far back in the past you want to go for pulling Coaching sessions.
    You can go back to the first ever coaching session on the platform unless data retention limits have
    been set.</li>
        <li> All the Coaching sessions that were Submitted, Edited and Deleted in the date-range will
    be available in the API response.</li>
          <ul>
            <li>Lets take an example to explain it further - when you pull Coaching sessions for 15 days(say
    for start_date - 15-Jan and end_date 30-Jan) on 15-Feb via an API call, you get all Coaching sessions
    that were -</li>
              <ul>
                <li>submitted between 15-jan and 30-jan with "status": "SUBMITTED"</li>
                <li>submitted before 15-jan but modified/deleted between 15-jan and 30-jan with "status"="EDITED"
    / "status"="DELETED"</li>
                <li>submitted between 15-jan and 30-jan but modified after 30-jan until the pull date(15-Feb)
    with "status"="EDITED"</li>
              </ul>
          </ul>
        <li>The S3 URL obtained in the API response (with the coaching sessions) is valid for 24 hours.
                        </li>
        <li>If you have been using Basic Auth for the APIs, we request you to switch to OAuth2.0 based
    Auth for the APIs by 31-Dec-2022. Detailed instructions to create API Credentials and make the switch
    to OAuth are documented <a href="#tag/Authentication">here</a>. Please reach out to your CSM for more
    details.</li>
      </ol>
