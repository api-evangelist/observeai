- aid: observeai:observeai-summary-api
  name: Observe.AI Summary API
  description: >-
    Summarization AI API can be used to pull the data related to summaries for a particular interaction
    including calls and chats.


    Please note -

    <ol>
      <li> Summaries can only be extracted if they are available for the interaction.</li>
      <li>Allow 24 hrs to pass before pulling summaries. ie., For summaries completed on 14-Jan by 12:00AM
    PST, they would be available via APIs by 15-Jan by 12:00AM PST.</li>
      <li>You can pull Summaries for 30 days at a time i.e., the duration between the end_date and the
    start_date should not exceed 30 days.</li>
      <li>There is no limit as to how far back in the past you want to go for pulling summaries. You can
    retrieve summaries from the very first ones generated on the platform, unless data retention limits
    have been set.</li>
      <li>Summarization AI API gives a paginated response so the customer need to specify the page number
    and the desired amount of summaries in a page. By default, page_size is set to 100</li>
      <li>There is flexibility to either include or exclude Transcript in the API response by setting
    a query parameter includeTranscript. By default it is set to false.</li>
      <li>The S3 URL obtained in the API response (with the summaries) is valid for 24 hours.</li>
      <li>If you need to pull Summaries by ID, there is a separate synchronous API - <a href="#tag/Summary/operation/Get
    Summaries By Ids">Get Summaries By Ids</a>.</li>
    </ol>
  humanURL: https://api-docs.observe.ai/
