openapi: 3.2.0
info:
  title: Reporting Ack Dispute Flow API
  description: "Reporting APIs are a collection of RESTful APIs that provide a convenient and secure way for integrating reporting data from Observe.AI into external system of your choice. These APIs are asynchronous and render data in a JSON format. Observe.AI uses OAuth 2.0 protocol for authentication of APIs. Please refer to Authentication section to obtain credentials to access Reporting APIs. Below are the 3 APIs that we support -\n      <ol>\n          <li><a href=\"#tag/Interactions\">Interactions API</a>- To fetch Moments, Transcripts and Interactions(Voice calls, Webchat, Email) metadata</li>\n          <li><a href=\"#tag/Evaluations\">Evaluations API</a> - To fetch Evaluation forms and submitted Evaluations along with question-wise scores and aggregate scores.</li>\n          <li><a href=\"#tag/Coachings\"> Coachings API </a> - To fetch Coaching sessions with mapped Evaluations and related Notes.</li>\n          <li><a href=\"#tag/Ack Dispute Flow\"> Ack Dispute API </a> - To fetch Ack/Dispute state changes for Evaluations.</li>\n          <li><a href=\"#tag/Summary\"> Summarization AI API </a> - To fetch GenAI-based Summaries along with Moments, Transcripts and metadata for all Interactions(Voice calls, Webchat).</li>\n      </ol>\n"
  x-logo:
    url: https://cdn.observe.ai/observeaiLogo.png
servers:
- url: https://{base_url}
  description: Generated server url, where `{base_url}` corresponds to the specific cluster's base URL.
tags:
- name: Ack Dispute Flow
  x-displayName: Evaluations/Ack Dispute API
  tags:
  - Ack Dispute Flow
  description: "Ack Dispute API can be used to pull all evaluation related data which are sent for acknowledgment or dispute.\n\nPlease note -\n    <ol>\n      <li>Allow 24 hrs to pass before pulling Ack Dispute Data. ie., For Evaluations completed on 14-Jan by 12:00AM PST, they would be available via APIs by 15-Jan by 12:00AM PST.</li>\n      <li>You can pull Ack Dispute for 90 days at a time i.e., the duration between the end_date and the start_date should not exceed 90 days.</li>\n      <Li>There is no limit as to how far back in the past you want to go for pulling Ack Dispuet Data. You can go back to the first ever evaluation on the platform unless data retention limits have been set.</li>\n      <li>The S3 URL obtained in the API response (with the evaluations) is valid for 24 hours.\n                                </li>\n      <li>If you have been using Basic Auth for the APIs, we request you to switch to OAuth2.0 based Auth for the APIs by 31-Dec-2022. Detailed instructions to create API Credentials and make the switch to OAuth are documented <a href=\"#tag/Authentication\">here</a>. Please reach out to your CSM for more details.</li>\n    </ol>\n"
paths:
  /v1/data/reports/evaluation/ackdisputedetails:
    post:
      tags:
      - Ack Dispute Flow
      operationId: Create Ack Dispute Request
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RawJobRequest'
      responses:
        '200':
          description: Ok
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PostJobResponse'
              examples:
                '0':
                  value: '{"request_id":"3058bc09-f9fc-4586-bc7c-498b95a63ec2","start_date":"2022-03-03T00:00:12.000+00:00","end_date":"2022-04-04T00:16:00.000+00:00","status":"INPROGRESS"}'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                '0':
                  value: '{"error_code":"bad_request","error_description":"similar job already exists with request id 3058bc09-b974-4468-ae1f-f7b9b28067f1"}'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                '0':
                  value: '{"error_code": "auth_token_error", "error_description": "invalid auth token"}'
        '403':
          description: Access Denied
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                '0':
                  value: '{"error_code":"access_denied","error_description":"unauthorized_user"}'
        '404':
          description: Request Not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                '0':
                  value: '{"timestamp":"2022-05-12T06:27:39.587+00:00","status":404,"error":"Not Found","message":"No message available","path":"/v1/data/reports/evaluation"}'
        '405':
          description: Method Not Allowed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                '0':
                  value: '{"timestamp": "2022-05-17T04:21:37.669+00:00", "status": 405, "error": "Method Not Allowed", "message": "Request method ''GET'' not supported", "path": "/v1/data/reports/evaluations"}'
        '429':
          description: Rate Limit Exceeded
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RateLimitMessage'
              examples:
                '0':
                  value: '{"message": "API rate limit exceeded"}'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /v1/data/reports/evaluation/ackdisputedetails/{request_id}:
    get:
      tags:
      - Ack Dispute Flow
      operationId: Get Ack Dispute Details
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "Report field Description:\n<table>\n  <tr>\n    <th>Param Name</th>\n    <th>Type</th>\n    <th>Description</th>\n  </tr>\n  <tr>\n    <td>page</td>\n    <td>integer</td>\n    <td>The current page number of the response from the total response present between the given date range</td>\n  </tr>\n  <tr>\n    <td>size</td>\n    <td>integer</td>\n    <td>Number of interactions present in the current page</td>\n  </tr>\n  <tr>\n    <td>total_pages</td>\n    <td>integer</td>\n    <td>Total number of pages present for the given date range.</td>\n  </tr>\n  <tr>\n    <td>total_size</td>\n    <td>integer</td>\n    <td>Total number of interactions present for the given date range.</td>\n  </tr>\n  <tr>\n    <td>ack_dispute_details</td>\n    <td>List</td>\n    <td>List of all the Evaluations with Ack Dispute Details.</td>\n  </tr>\n  <tr>\n    <td>evaluation_id</td>\n    <td>String</td>\n    <td>ID of the evaluation.</td>\n  </tr>\n  <tr>\n    <td>evaluation_form_id</td>\n    <td>String</td>\n    <td>ID of the template/evaluation form.</td>\n  </tr>\n  <tr>\n    <td>ack_status</td>\n    <td>String</td>\n    <td>\n      Captures current status of Evaluation form in the Acknowledgement-Dispute workflow\n      <ul>\n      <li>NOT_INITIATED - Evaluation form is submitted without initiating for Acknowledgement</li>\n      <li>AWAITING_ACK - Agent has been notified of Evaluation. Acknowledgement pending from Agent</li>\n      <li>ACKED - Agent Acknowledged the Evaluation</li>\n      <li>IN_DISPUTE - Dispute raised(typically by Agent or Supervisor) on Evaluation form and awaiting resolution</li>\n      <li>DISPUTE_ACCEPTED - Dispute has been accepted by resolver(typically QA Analyst/QA Manager)</li>\n      <li>DISPUTE_PARTIAL - Dispute has been partially accepted by resolver(typically QA Analyst/QA Manager)</li>\n      <li>DISPUTE_REJECTED - Dispute has been rejected  by resolver(typically QA Analyst/QA Manager)</li>\n      </ul>\n    </td>\n  </tr>\n  <tr>\n    <td>timeline</td>\n    <td>List</td>\n    <td>List of timelines in the given time range for this particular evaluation id.</td>\n  </tr>\n  <tr>\n    <td>timeline.time</td>\n    <td>String</td>\n    <td>Timestamp of the timeline.</td>\n  </tr>\n  <tr>\n    <td>timeline.comment</td>\n    <td>String</td>\n    <td>Comment.</td>\n  </tr>\n  <tr>\n    <td>timeline.score_info</td>\n    <td>Object</td>\n    <td>Status of the Evaluation Form in this timeline.</td>\n  </tr>\n  <tr>\n    <td>timeline.disputed_questions</td>\n    <td>Object</td>\n    <td>Disputed Questions of the Evaluation Form in this timeline.</td>\n  </tr>\n  <tr>\n    <td>timeline.dispute_resolved_questions</td>\n    <td>Object</td>\n    <td>Dispute Resolved Questions of the Evaluation Form in this timeline.</td>\n  </tr>\n  <tr>\n    <td>timeline.dispute_partial_resolved_questions</td>\n    <td>Object</td>\n    <td>Dispute Partial Resolved Questions of the Evaluation Form in this timeline.</td>\n  </tr>\n  <tr>\n    <td>timeline.dispute_shared_with</td>\n    <td>List</td>\n    <td>List of users to whome Dispute was shared.</td>\n  </tr>\n  <tr>\n    <td>scoreinfo.prebonus_score</td>\n    <td>double</td>\n    <td>Prebonus Score for the Evaluation.</td>\n  </tr>\n  <tr>\n    <td>scoreinfo.bonus</td>\n    <td>double</td>\n    <td>Bonus for the Evaluation.</td>\n  </tr>\n  <tr>\n    <td>scoreinfo.penalty</td>\n    <td>double</td>\n    <td>Penalty for the Evaluation.</td>\n  </tr>\n  <tr>\n    <td>scoreinfo.obtained_score</td>\n    <td>double</td>\n    <td>Obtained Score for the Evaluation.</td>\n  </tr>\n  <tr>\n    <td>scoreinfo.total_score</td>\n    <td>double</td>\n    <td>Total Score for the Evaluation.</td>\n  </tr>\n  <tr>\n    <td>scoreinfo.result</td>\n    <td>Object</td>\n    <td>Result for the Evaluation.</td>\n  </tr>\n  <tr>\n    <td>scoreinfo.calculated_score</td>\n    <td>Object</td>\n    <td>Calculated Score for the Evaluation.</td>\n  </tr>\n  <tr>\n    <td>qaquestionresponse.question_id</td>\n    <td>String</td>\n    <td>Question ID.</td>\n  </tr>\n  <tr>\n    <td>qaquestionresponse.selected_option</td>\n    <td>List</td>\n    <td>Selected options for each question.</td>\n  </tr>\n  <tr>\n    <td>qaquestionresponse.obtained_score</td>\n    <td>List</td>\n    <td>Score obtained for each question.</td>\n  </tr>\n  <tr>\n    <td>qaquestionresponse.comment</td>\n    <td>String</td>\n    <td>Comment.</td>\n  </tr>\n  <tr>\n    <td>qaquestionresponse.is_fail</td>\n    <td>integer</td>\n    <td>If that Agent has failed that question or not.</td>\n  </tr>\n  <tr>\n    <td>qaquestionresponse.is_auto_fail</td>\n    <td>integer</td>\n    <td>Is autofail</td>\n  </tr>\n  <tr>\n    <td>qaquestionresponse.visibility_logic_applied</td>\n    <td>integer</td>\n    <td>Is visibility logic applied.</td>\n  </tr>\n</table>\n"
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GetJobResponse'
              examples:
                '0':
                  value: '{"start_date":"2022-03-03T00:00:12.000+00:00","end_date":"2022-04-04T00:14:00.000+00:00","status":"COMPLETED","url":"https://e2e-data-out.s3.amazonaws.com/reports/ackdispute/3058bc09-6d4d-4f22-9f69-6992f3520e56.json?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Date=20220510T045319Z&X-Amz-SignedHeaders=host&X-Amz-Expires=86400&X-Amz-Credential=YOUR_AWS_ACCESS_KEY_ID%2FYYYYMMDD%2Fus-east-1%2Fs3%2Faws4_request&X-Amz-Signature=YOUR_AWS_SIGNATURE_PLACEHOLDER"}'
