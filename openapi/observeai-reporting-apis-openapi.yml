components:
  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        example: 1
        default: 1
      description: The page number of the paginated response.
    Size:
      in: query
      name: size
      schema:
        type: integer
        minimum: 10
        maximum: 1000
        example: 1000
        default: 1000
      description: Number of evaluations required in a page.
    InteractionsSize:
      in: query
      name: size
      schema:
        type: integer
        minimum: 10
        maximum: 100
        example: 100
        default: 100
      description: Number of interactions required in a page. Note that for requests without transcripts maximum size can be 1000.
    IncludeTranscript:
      in: query
      name: includeTranscript
      schema:
        type: boolean
        example: true
        default: false
      description: Whether to include the transcript or not.
    IncludeSummary:
      in: query
      name: includeSummary
      schema:
        type: boolean
        example: true
        default: false
      description: Whether to include the summary or not.
    EvaluationType:
      in: query
      name: evaluationType
      schema:
        type: enum
        default: MANUAL
        example: AUTOQA
      description: Choose from MANUAL, AUTOQA or ALL types of evaluation forms. All manual evaluations are fetched if evaluationType is not specified.
  schemas:
    ErrorMessage:
      type: object
      properties:
        error_code:
          type: string
        error_description:
          type: string
    RateLimitMessage:
      type: object
      properties:
        message:
          type: string
          description: "API rate limit exceeded"
    RawJobRequest:
      required:
        - end_date
        - start_date
      type: object
      properties:
        start_date:
          type: string
          example: "2022-03-03T00:00:12.000+00:00"
          description: The date should be given in the ISO format.
        end_date:
          type: string
          example: "2022-04-04T00:14:00.000+00:00"
          description: The date should be given in the ISO format.
        format:
          type: string
          example: "JSON"
          enum:
            - JSON
    AckDisputeFlowRequestIds:
      properties:
        evaluation_ids:
          type: List<String>
          example: ["5e178d4246a3ce00010931d2","5e73d49ff2d4540001657309"]
          description: Give the list of evaluation_ids to fetch ack dispute details. Max Limit of 100 ids.
    InteractionsRequest:
      properties:
        observe_interaction_ids:
          type: List<String>
          example: ["af1d1b95-de6d-42db-83bd-3a585e65fcc9","4909093-918a-41ab-9fe3-0d1880fa2fd3"]
          description: Mandatory if partner_interaction_ids is not present. Both cannot be present together. Max Limit of 100 ids.
        partner_interaction_ids:
          type: List<String>
          example: ["7f9744f08a45cb0010d3a7c8","9f583739466b73001e4a125c"]
          description: Mandatory if observe_interaction_ids is not present. Both cannot be present together. Max Limit of 100 ids.
    PostJobResponse:
      type: object
      properties:
        request_id:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - QUEUED
            - INPROGRESS
            - COMPLETED
            - EXPIRED
            - FAILED
    GetJobResponse:
      type: object
      properties:
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - QUEUED
            - INPROGRESS
            - COMPLETED
            - EXPIRED
            - FAILED
        url:
          type: string

    OauthTokenRequest:
      type: object
      properties:
        app_id:
          type: string
        app_secret:
          type: string
      title: OauthTokenRequest

    OauthTokenResponse:
      type: object
      properties:
        auth_token:
          type: string
        expires_in:
          type: integer
          format: int32
      title: OauthTokenResponse
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    DsrDeleteRequest:
      type: object
      required:
        - entity_type
        - rules
      properties:
        entity_type:
          type: string
          description: Entity type to delete
          enum:
            - AUDIO_TRANSCRIPT
            - AUDIO
            - TRANSCRIPT
            - SCREEN_RECORDING
        rules:
          type: array
          items:
            "$ref": "#/components/schemas/DsrRule"

    DsrRule:
      type: object
      required:
        - type
        - name
      properties:
        type:
          type: string
          enum:
            - OAI_METADATA
            - CUSTOMER_METADATA
        name:
          type: string
          description: For OAI_METADATA use DURATION, ENTITYTYPE, or STATUS
        values:
          type: array
          items:
            type: string

    DsrDeleteResponse:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          enum:
            - QUEUED
            - CREATED
            - PROGRESS
            - COMPLETED
            - STOPPED
            - FAILED
        message:
          type: string
        requested_at:
          type: string
          format: date-time
        expected_completion_by:
          type: string
          format: date-time

    DsrStatusResponse:
      type: object
      properties:
        request_id:
          type: string
        status:
          type: string
          enum:
            - QUEUED
            - CREATED
            - PROGRESS
            - COMPLETED
            - STOPPED
            - FAILED
        status_message:
          type: string
