servers:
  - url: https://{base_url}
    description: Generated server url, where `{base_url}` corresponds to the specific cluster's base URL.
paths:
  "/v1/oauth/token":
    post:
      tags:
        - Authentication
      operationId: Create Auth Token
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OauthTokenRequest"
      consumes:
        - application/json
      produces:
        - '*/*'
      parameters:
        - in: body
          name: oauthTokenRequest
          description: oauthTokenRequest
          required: true
          schema:
            $ref: '#/components/schemas/OauthTokenRequest'
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": '#/components/schemas/OauthTokenResponse'
              examples:
                '0':
                  value: >-
                    {"auth_token":"", "expires_in":7200 (in seconds)}
        '401':
          description: Unauthorized
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorMessage"
              examples:
                '0':
                  value: >-
                    {"error_code": "auth_token_error",
                    "error_description": "Invalid/Inactive Credentials"}
        '403':
          description: Forbidden
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorMessage"
        '404':
          description: Not Found
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorMessage"
  "/v1/dsr/delete/on-demand":
    post:
      tags:
        - DSR
      summary: Submit DSR deletion request
      operationId: Create Dsr Delete Request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DsrDeleteRequest"
            examples:
              '0':
                value:
                  entity_type: TRANSCRIPT
                  rules:
                    - type: OAI_METADATA
                      name: Region
                      values:
                        - UK
                    - type: CUSTOMER_METADATA
                      name: Campaign
                      values:
                        - iPhone
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/DsrDeleteResponse"
              examples:
                '0':
                  value:
                    job_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    status: QUEUED
                    message: Deletion job accepted and queued for processing.
                    requested_at: "2025-12-04T08:00:00Z"
                    expected_completion_by: "2026-01-03T08:00:00Z"
        '400':
          description: Bad Request
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorMessage"
              examples:
                '0':
                  value:
                    error_code: bad_request
                    error_description: Entity type is not supported
        '401':
          description: Unauthorized
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorMessage"
        '403':
          description: Forbidden
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorMessage"
        '500':
          description: Internal Server Error
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorMessage"
  "/v1/dsr/delete/{job_id}/status":
    get:
      tags:
        - DSR
      summary: Get DSR deletion status
      operationId: Get Dsr Delete Status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
          description: Job ID returned by the delete request
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
